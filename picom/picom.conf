# .config/picom/picom.conf
# Configurado por Gandalf para Ricardo Machuca

#################################
#             Shadows           #
#################################
shadow = false;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'flameshot'",
  "class_g = 'Flameshot'"
];

#################################
#           Fading              #
#################################
fading = true
fade-in-step = 0.03;
fade-out-step = 0.03;

#################################
#   Transparency / Opacity      #
#################################
inactive-opacity = 0.80;
active-opacity = 0.95;
frame-opacity = 0.80;
inactive-opacity-override = false;

focus-exclude = [ "class_g = 'Cairo-clock'" ];

opacity-rule = [
        "50:class_g = 'Bspwm' && class_i = 'presel_feedback'",
        "100:class_g = 'Rofi'",
        "80:class_g = 'Caja'",
        "99:class_g = 'Google-chrome'",
        "99:class_g = 'burp-StartBurp'"
];

#################################
#     Background-Blurring       #
#################################
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'flameshot'",
  "class_g = 'Flameshot'"
];

#################################
#        General Settings       #
#################################
backend = "glx";
vsync = true

mark-wmwin-focused = true;
mark-ovredir-focused = false;
detect-rounded-corners = true;
detect-client-opacity = true;
refresh-rate = 0
detect-transient = true
detect-client-leader = true
use-damage = true
log-level = "warn";

#################################
#           Corners             #
#################################
corner-radius = 15.0;
rounded-corners-exclude = [
  "class_g = 'rofi'",
  "class_g = 'Polybar'",
  "class_g = 'firefox'"
];

#################################
#       Window type settings    #
#################################
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.75; focus = true; full-shadow = false; };
  dock = { shadow = false; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.8; }
  dropdown_menu = { opacity = 0.8; }
};
